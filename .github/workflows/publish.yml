name: Upload Python Package

on:
  push:
    tags:
      - 'v*' # This triggers the upload whenever you push a tag like v1.0.2
  workflow_dispatch: # Keeps the manual button just in case

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Build package
        run: |
          python -m pip install build
          python -m build
      - name: Publish package
        uses: pypa/gh-action-pypi-publish@release/v1
