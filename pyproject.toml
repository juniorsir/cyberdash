[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cyberdash"
version = "1.0.4"
description = "A modern hacker-style TUI dashboard for Linux and Termux"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "textual",
    "psutil",
    "requests"
]

[project.scripts]
cyberdash = "cyberdash.app:run"
